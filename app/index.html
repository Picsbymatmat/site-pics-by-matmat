<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>picsbymatmat — Book a shoot</title>
    <meta
      name="description"
      content="Book Matt for a product, brand, event, or portrait shoot. See the work, check availability, and request a date."
    />
    <meta property="og:title" content="picsbymatmat — Book a shoot" />
    <meta
      property="og:description"
      content="Book Matt for a product, brand, event, or portrait shoot. See the work, check availability, and request a date."
    />
    <!-- TODO(Phase 3): replace with a real hero frame once Matt supplies photography (§15) -->
    <meta property="og:image" content="/images/placeholder/brand/01-brand.jpg" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Netlify Forms notification (§2, §9, §11) — the last-resort email,
      sent only when Cal.com couldn't take a booking or couldn't carry its
      details (see netlify/functions/booking.ts). Netlify only registers a
      form for its build-time bot-notification pipeline if it finds
      matching static HTML somewhere in the built output — a form only
      ever POSTed to from JS or a serverless function is invisible to it.
      This markup is never rendered/shown (display: none, outside #root,
      not mounted by React) and never submitted from here; its only job is
      to give Netlify's scanner a `booking-fallback` form with every field
      the booking function's Netlify Forms POST sends.

      Field choices that shape the notification email, since Netlify's
      built-in email notification has no template/formatting options of
      its own beyond the fields it's given:
      - `subject` is Netlify's own reserved field name — whatever value is
        submitted under it becomes the email's subject line (Netlify docs,
        Forms > Submission notifications). booking.ts sets it dynamically
        per submission (e.g. "New booking: Brand, Jane Doe"), with no "&"
        in it — Netlify HTML-escapes the subject line, so one shows up as
        a literal "&amp;". The call sheet's own "who/what the shoot is of"
        answer goes on the `details` line instead — reusing `subject` for
        it would overwrite the email subject with whatever the visitor
        typed.
      - `email` sets the Reply-To header (Netlify docs), so Matt can hit
        reply and it goes straight to the client, not Netlify.
      - Every field is one booking.ts always fills in: the per-category
        answers are joined onto the single `details` line, and phone vs.
        Instagram onto `contact`, so the email never lists a row of blank
        fields belonging to the three categories a booking isn't.
      - Netlify turns each field name into the email's label ("when" →
        "When"), and field order here drives the order they're listed in.
    -->
    <form name="booking-fallback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="booking-fallback" />
      <input type="text" name="bot-field" />
      <input type="text" name="subject" />
      <input type="text" name="calendar" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="contact" />
      <input type="text" name="shoot" />
      <input type="text" name="when" />
      <input type="text" name="location" />
      <input type="text" name="delivery" />
      <input type="text" name="details" />
      <textarea name="notes"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
